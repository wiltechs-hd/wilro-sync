# Smoke run: a few dozen HDTF clips, ~2k steps on one L4/A100. Checks that download, cropping, SyncNet
# filtering, preparation and training all work and that the loss falls.
name: smoke
description: 40 HDTF segments (~1.5 h), no TalkVid, no MEAD
hdtf:
  enabled: true
  max_segments: 40
  holdout_groups: 10
talkvid:
  enabled: false
mead:
  enabled: false
clips:
  size: 512
  frames: 49
  clips_per_minute: 3
  max_clips_per_video: 8
storage_budget_gb: 15
train_overrides:
  max_steps: 2000
  save_every: 250
  keep_last: 2
